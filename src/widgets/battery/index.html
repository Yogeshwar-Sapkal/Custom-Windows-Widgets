<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battery</title>
  <link rel="stylesheet" href="../../shared/widget.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="card">
    <div id="fit">
      <div id="battery" hidden>
        <header>
          <div id="title">Battery</div>
          <div id="status" class="note" hidden></div>
        </header>
        <div id="rows"></div>
      </div>
    </div>

    <div id="message" class="center-msg" hidden></div>

    <section id="settings" class="panel" data-title="Settings" hidden>
      <div class="field"><span class="label">Size</span><div id="opt-size"></div></div>
      <div class="field">
        <span class="label">Background</span>
        <input id="opt-opacity" type="range" min="0" max="100" step="1" aria-label="Background" />
        <div class="range-ends"><span>See-through</span><span>Solid</span></div>
      </div>
      <label class="row"><span>Show devices with no battery reading<span class="hint">Shown as "No reading"</span></span><input id="opt-noreading" type="checkbox" class="switch" /></label>
      <label class="row"><span>Show paired devices that aren't connected</span><input id="opt-disconnected" type="checkbox" class="switch" /></label>
      <label class="row"><span>Always on top</span><input id="opt-top" type="checkbox" class="switch" /></label>
      <p class="note">Bluetooth levels appear only for devices that report one to Windows. Updates every 2 minutes.</p>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
