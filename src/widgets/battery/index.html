<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battery</title>
  <link rel="stylesheet" href="../../shared/widget.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="card">
    <div id="fit">
      <div id="battery" hidden>
        <header>
          <div id="title">Battery</div>
          <div id="status" class="note"></div>
        </header>
        <div id="rows"></div>
      </div>
    </div>

    <div id="controls">
      <button id="btn-refresh" class="icon-btn" title="Refresh" aria-label="Refresh">&#8635;</button>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
      <button id="btn-close" class="icon-btn" title="Hide (use the tray icon to show again)" aria-label="Hide">&times;</button>
    </div>

    <div id="message" class="center-msg" hidden></div>

    <section id="settings" class="panel" hidden>
      <label>Size <span id="size-val"></span>
        <input id="opt-size" type="range" min="10" max="28" step="1" />
      </label>
      <label>Background opacity
        <input id="opt-opacity" type="range" min="0" max="100" step="1" />
      </label>
      <label class="check"><input id="opt-noreading" type="checkbox" /> Show devices that don't report a battery level</label>
      <label class="check"><input id="opt-disconnected" type="checkbox" /> Show paired devices that aren't connected</label>
      <label class="check"><input id="opt-top" type="checkbox" /> Always on top</label>
      <p class="note">Bluetooth levels appear only for devices that report one to Windows. Updates every 2 minutes.</p>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
