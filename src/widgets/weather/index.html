<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather</title>
  <link rel="stylesheet" href="../../shared/widget.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="card">
    <div id="fit">
      <div id="weather" hidden>
        <header>
          <button id="loc" type="button" class="loc-btn" aria-label="Change location"></button>
          <div id="status" class="note" hidden></div>
        </header>

        <section id="now">
          <div id="now-icon"></div>
          <div id="now-temp"></div>
          <div id="now-meta">
            <div id="now-text"></div>
            <div id="now-feels" class="note"></div>
            <div id="now-range" class="note"></div>
          </div>
        </section>

        <section id="stats">
          <div class="stat"><span class="k">Wind</span><span id="st-wind" class="v"></span><span class="s"></span></div>
          <div class="stat"><span class="k" id="st-precip-k">Rain now</span><span id="st-precip" class="v"></span><span class="s"></span></div>
          <div class="stat"><span class="k">UV index</span><span id="st-uv" class="v"></span><span id="st-uv-s" class="s"></span></div>
          <div class="stat"><span class="k">Humidity</span><span id="st-hum" class="v"></span><span class="s"></span></div>
        </section>

        <section id="sec-hourly">
          <h3><span>Next 24 hours</span><span id="readout"></span></h3>
          <div id="chart"></div>
        </section>

        <section id="sec-daily">
          <h3>Next 5 days</h3>
          <div id="daily"></div>
        </section>
      </div>
    </div>

    <div id="message" class="center-msg" hidden></div>

    <section id="search" class="panel" data-title="Change location" data-done="Cancel" hidden>
      <input id="search-input" type="text" placeholder="Search a city" autocomplete="off" spellcheck="false" enterkeyhint="search" />
      <ul id="search-results" class="results"></ul>
    </section>

    <section id="settings" class="panel" data-title="Settings" hidden>
      <div class="field"><span class="label">Units</span><div id="opt-units"></div></div>
      <div class="field"><span class="label">Size</span><div id="opt-size"></div></div>
      <div class="field">
        <span class="label">Background</span>
        <input id="opt-opacity" type="range" min="0" max="100" step="1" aria-label="Background" />
        <div class="range-ends"><span>See-through</span><span>Solid</span></div>
      </div>
      <label class="row"><span>24-hour time</span><input id="opt-24h" type="checkbox" class="switch" /></label>
      <label class="row"><span>Show the next 24 hours</span><input id="opt-hourly" type="checkbox" class="switch" /></label>
      <label class="row"><span>Show the next 5 days</span><input id="opt-daily" type="checkbox" class="switch" /></label>
      <label class="row"><span>Always on top</span><input id="opt-top" type="checkbox" class="switch" /></label>
      <p class="note">Weather data by Open-Meteo. Updates every 15 minutes.</p>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
