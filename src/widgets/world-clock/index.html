<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Clock</title>
  <link rel="stylesheet" href="../../shared/widget.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="card">
    <div id="fit"><div id="clocks"></div></div>

    <section id="search" class="panel" data-title="Add a clock" data-done="Cancel" hidden>
      <input id="search-input" type="text" placeholder="Search a city or country" autocomplete="off" spellcheck="false" enterkeyhint="search" />
      <ul id="search-results" class="results"></ul>
    </section>

    <section id="clock-panel" class="panel" data-title="Clock" hidden>
      <p id="clock-panel-name" class="clock-name"></p>
      <button id="btn-remove-clock" type="button" class="btn danger block">Remove this clock</button>
    </section>

    <section id="settings" class="panel" data-title="Settings" hidden>
      <div class="field"><span class="label">Layout</span><div id="opt-layout"></div></div>
      <div class="field"><span class="label">Size</span><div id="opt-size"></div></div>
      <div class="field">
        <span class="label">Background</span>
        <input id="opt-opacity" type="range" min="0" max="100" step="1" aria-label="Background" />
        <div class="range-ends"><span>See-through</span><span>Solid</span></div>
      </div>
      <label class="row"><span>24-hour time</span><input id="opt-24h" type="checkbox" class="switch" /></label>
      <label class="row"><span>Show seconds</span><input id="opt-seconds" type="checkbox" class="switch" /></label>
      <label class="row"><span>Show the difference from my time<span class="hint">For example +5h30</span></span><input id="opt-offset" type="checkbox" class="switch" /></label>
      <label class="row"><span>Always on top</span><input id="opt-top" type="checkbox" class="switch" /></label>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
